version: 2
updates:
  # pnpm workspace: root, apps/* and packages/*
  - package-ecosystem: npm
    directories: ["/", "apps/*", "packages/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Expo SDK pins these together; upgrade them deliberately with `expo install` / the SDK upgrade guide.
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      # postgres 4.x makes every request that reaches the database exceed the Worker's CPU limit (about 1 s of CPU per
      # request on the dev Worker, so sync and sign-in fail with 503). Stay on 3.x until a newer 4.x is tested on dev.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
