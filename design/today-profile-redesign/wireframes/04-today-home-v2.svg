<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Viewport: mobile 375x812. State: signed in, partner NOT yet joined, populated. Monochrome. -->
  <rect x="0" y="0" width="375" height="812" fill="#fff" />

  <!-- Status bar -->
  <g transform="translate(24, 16)">
    <text x="0" y="14" font-size="14" font-weight="600" stroke="none" fill="#000">9:41</text>
    <rect x="295" y="4" width="24" height="12" rx="3" fill="#fff" />
    <rect x="297" y="6" width="16" height="8" rx="1" fill="#000" stroke="none" />
  </g>

  <!-- 1. Greeting row: eyebrow + two avatars + greeting + one-line status. Whole row opens Profile. -->
  <text x="24" y="64" font-size="12" font-weight="600" stroke="none" fill="#666">FRIDAY, 6 NOVEMBER</text>
  <g transform="translate(24, 72)">
    <!-- partner avatar sits behind -->
    <circle cx="48" cy="24" r="20" fill="#e6e6e6" stroke-dasharray="4 3" />
    <text x="48" y="29" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#666">S</text>
    <circle cx="20" cy="24" r="20" fill="#e6e6e6" />
    <text x="20" y="29" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#000">G</text>
    <text x="84" y="22" font-size="20" font-weight="700" stroke="none" fill="#000">Good evening, Gonçalo</text>
    <text x="84" y="42" font-size="12" stroke="none" fill="#666">3 today · Sofia's birthday in 4 days</text>
  </g>

  <!-- 2. Contextual setup card (only while there is a next step; dismissable) -->
  <g transform="translate(24, 136)">
    <rect width="327" height="88" rx="8" />
    <g transform="translate(16, 16)">
      <text x="0" y="12" font-size="12" font-weight="600" stroke="none" fill="#666">FINISH SETTING UP</text>
      <text x="0" y="36" font-size="14" font-weight="600" stroke="none" fill="#000">Invite Sofia to your space</text>
      <text x="0" y="56" font-size="12" stroke="none" fill="#666">Code valid until 12 Nov</text>
      <rect x="215" y="24" width="80" height="32" rx="4" />
      <text x="255" y="45" font-size="14" text-anchor="middle" stroke="none" fill="#000">Invite</text>
      <!-- dismiss -->
      <line x1="283" y1="2" x2="291" y2="10" />
      <line x1="291" y1="2" x2="283" y2="10" />
    </g>
  </g>

  <!-- 3. Needs attention -->
  <g transform="translate(24, 240)">
    <rect width="327" height="104" rx="8" stroke-width="2" />
    <g transform="translate(16, 16)">
      <text x="0" y="14" font-size="12" font-weight="600" stroke="none" fill="#666">NEEDS ATTENTION</text>
      <rect x="0" y="32" width="16" height="16" rx="4" />
      <text x="32" y="45" font-size="14" stroke="none" fill="#000">Renew car insurance</text>
      <rect x="239" y="30" width="56" height="20" rx="4" fill="#e6e6e6" stroke="none" />
      <text x="267" y="44" font-size="12" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Both</text>
      <rect x="0" y="64" width="16" height="16" rx="4" />
      <text x="32" y="77" font-size="14" stroke="none" fill="#000">Book vet appointment</text>
      <rect x="239" y="62" width="56" height="20" rx="4" fill="#e6e6e6" stroke="none" />
      <text x="267" y="76" font-size="12" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Me</text>
    </g>
  </g>

  <!-- 4. Coming up -->
  <g transform="translate(24, 360)">
    <rect width="327" height="128" rx="8" />
    <g transform="translate(16, 16)">
      <text x="0" y="14" font-size="12" font-weight="600" stroke="none" fill="#666">COMING UP</text>
      <text x="0" y="38" font-size="14" font-weight="600" stroke="none" fill="#000">Dinner with Marta</text>
      <text x="0" y="54" font-size="12" stroke="none" fill="#666">Today · 20:00</text>
      <line x1="0" y1="64" x2="295" y2="64" stroke="#e6e6e6" />
      <text x="0" y="86" font-size="14" font-weight="600" stroke="none" fill="#000">Dentist</text>
      <text x="0" y="102" font-size="12" stroke="none" fill="#666">Tomorrow · 09:30</text>
    </g>
  </g>

  <!-- 5. Us strip: day count + next special date. Tap opens Us tab. -->
  <g transform="translate(24, 504)">
    <rect width="327" height="72" rx="8" />
    <line x1="160" y1="16" x2="160" y2="56" />
    <g transform="translate(16, 16)">
      <text x="0" y="12" font-size="12" font-weight="600" stroke="none" fill="#666">TOGETHER</text>
      <text x="0" y="38" font-size="20" font-weight="700" stroke="none" fill="#000">Day 482</text>
    </g>
    <g transform="translate(176, 16)">
      <text x="0" y="12" font-size="12" font-weight="600" stroke="none" fill="#666">SOFIA'S BIRTHDAY</text>
      <text x="0" y="38" font-size="20" font-weight="700" stroke="none" fill="#000">in 4 days</text>
    </g>
  </g>

  <!-- 6. Partner presence row -->
  <g transform="translate(24, 592)">
    <rect width="327" height="56" rx="8" />
    <circle cx="32" cy="28" r="16" fill="#e6e6e6" stroke-dasharray="4 3" />
    <text x="32" y="33" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#666">S</text>
    <text x="64" y="25" font-size="14" font-weight="600" stroke="none" fill="#000">Sofia</text>
    <text x="64" y="43" font-size="12" stroke="none" fill="#666">2 tasks left today</text>
    <polyline points="303,22 309,28 303,34" fill="none" />
  </g>

  <text x="187" y="668" font-size="12" text-anchor="middle" stroke="none" fill="#666">Tasks · Groceries · Important dates</text>

  <!-- 7. Capture bar, pinned above tab bar -->
  <g transform="translate(24, 676)">
    <rect width="327" height="48" rx="24" />
    <circle cx="28" cy="24" r="12" fill="#000" stroke="none" />
    <line x1="22" y1="24" x2="34" y2="24" stroke="#fff" stroke-width="2" />
    <line x1="28" y1="18" x2="28" y2="30" stroke="#fff" stroke-width="2" />
    <text x="52" y="29" font-size="14" stroke="none" fill="#666">Capture a task, event or note…</text>
  </g>

  <!-- Tab bar: Today · Calendar · Household · Lists · Us -->
  <g transform="translate(0, 740)">
    <line x1="0" y1="0" x2="375" y2="0" />
    <rect x="32" y="12" width="24" height="24" rx="6" fill="#000" />
    <text x="44" y="56" font-size="12" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Today</text>
    <rect x="104" y="12" width="24" height="24" rx="6" />
    <text x="116" y="56" font-size="12" text-anchor="middle" stroke="none" fill="#666">Calendar</text>
    <rect x="176" y="12" width="24" height="24" rx="6" />
    <text x="188" y="56" font-size="12" text-anchor="middle" stroke="none" fill="#666">Home</text>
    <rect x="248" y="12" width="24" height="24" rx="6" />
    <text x="260" y="56" font-size="12" text-anchor="middle" stroke="none" fill="#666">Lists</text>
    <rect x="320" y="12" width="24" height="24" rx="6" />
    <text x="332" y="56" font-size="12" text-anchor="middle" stroke="none" fill="#666">Us</text>
  </g>
  <rect x="120" y="796" width="136" height="8" rx="4" fill="#000" stroke="none" />

  <!-- Annotation layer (red dashed) -->
  <g stroke="#d33" stroke-width="1.5" stroke-dasharray="4 3" fill="#fff">
    <circle cx="12" cy="96" r="8" /><text x="12" y="100" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">1</text>
    <circle cx="12" cy="180" r="8" /><text x="12" y="184" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">2</text>
    <circle cx="12" cy="292" r="8" /><text x="12" y="296" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">3</text>
    <circle cx="12" cy="424" r="8" /><text x="12" y="428" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">4</text>
    <circle cx="12" cy="540" r="8" /><text x="12" y="544" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">5</text>
    <circle cx="12" cy="620" r="8" /><text x="12" y="624" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">6</text>
    <circle cx="12" cy="700" r="8" /><text x="12" y="704" font-size="12" text-anchor="middle" stroke="none" fill="#d33" font-weight="600">7</text>
  </g>
</svg>
