<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="375" height="812" fill="#fff" />

  <!-- Status Bar (Mobile 375x44) -->
  <g transform="translate(24, 16)">
    <text x="0" y="14" font-size="14" font-weight="600" stroke="none" fill="#000">9:41</text>
    <!-- Battery / Signal placeholder icons -->
    <rect x="295" y="4" width="24" height="12" rx="3" fill="#fff" />
    <rect x="297" y="6" width="16" height="8" rx="1" fill="#000" stroke="none" />
    <line x1="280" y1="14" x2="280" y2="8" />
    <line x1="284" y1="14" x2="284" y2="6" />
    <line x1="288" y1="14" x2="288" y2="4" />
  </g>

  <!-- Hero & Brand Symbol: The Dyad (Two complementary elements) -->
  <g transform="translate(187, 240)">
    <!-- Dyad Left Organic Element -->
    <path d="M -32,-32 C -56,-16 -56,24 -24,40 C -8,48 0,32 -8,8 C -16,-16 -16,-32 -32,-32 Z" fill="#e6e6e6" />
    <!-- Dyad Right Organic Element -->
    <path d="M 32,-32 C 56,-16 56,24 24,40 C 8,48 0,32 8,8 C 16,-16 16,-32 32,-32 Z" fill="#000" stroke="none" />
    <!-- Connecting Equilibrium Circle -->
    <circle cx="0" cy="12" r="8" fill="#fff" stroke="#000" stroke-width="2" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(187, 336)">
    <text x="0" y="0" font-size="28" font-weight="700" text-anchor="middle" stroke="none" fill="#000">Díade</text>
    <text x="0" y="32" font-size="14" text-anchor="middle" stroke="none" fill="#666">Two distinct elements. One shared space.</text>
  </g>

  <!-- Value Proposition Points -->
  <g transform="translate(32, 420)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="4" fill="#000" stroke="none" />
      <text x="28" y="16" font-size="14" stroke="none" fill="#000">Coordinate daily life &amp; shared calendar</text>
    </g>
    <!-- Point 2 -->
    <g transform="translate(0, 36)">
      <circle cx="12" cy="12" r="4" fill="#000" stroke="none" />
      <text x="28" y="16" font-size="14" stroke="none" fill="#000">Real-time grocery &amp; household lists</text>
    </g>
    <!-- Point 3 -->
    <g transform="translate(0, 72)">
      <circle cx="12" cy="12" r="4" fill="#000" stroke="none" />
      <text x="28" y="16" font-size="14" stroke="none" fill="#000">Private by design for exactly two people</text>
    </g>
  </g>

  <!-- Auth Actions -->
  <g transform="translate(32, 590)">
    <!-- Continue with Google Button -->
    <rect x="0" y="0" width="311" height="52" rx="8" fill="#000" />
    <!-- Google 'G' Symbol Placeholder -->
    <circle cx="28" cy="26" r="10" fill="#fff" stroke="none" />
    <text x="28" y="31" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#000">G</text>
    <text x="165" y="32" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">Continue with Google</text>

    <!-- Alternative Note / Privacy Guarantee -->
    <text x="155" y="80" font-size="12" text-anchor="middle" stroke="none" fill="#666">Private &amp; encrypted. No ads. No public sign-up.</text>
  </g>

  <!-- Home Indicator (Mobile) -->
  <rect x="120" y="796" width="135" height="5" rx="2.5" fill="#000" stroke="none" />

  <!-- Annotations Layer -->
  <g stroke="#d33" stroke-width="1.5" stroke-dasharray="4,4" fill="none">
    <!-- Callout 1: Brand Symbol -->
    <rect x="135" y="195" width="105" height="100" rx="4" />
    <circle cx="135" cy="195" r="10" fill="#d33" stroke="none" />
    <text x="135" y="199" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#fff">1</text>

    <!-- Callout 2: Auth Trigger -->
    <rect x="28" y="586" width="319" height="60" rx="10" />
    <circle cx="28" cy="586" r="10" fill="#d33" stroke="none" />
    <text x="28" y="590" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#fff">2</text>
  </g>
</svg>
