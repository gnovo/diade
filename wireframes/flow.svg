<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="1280" height="800" fill="#fff" />

  <!-- Flow Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="24" font-size="28" font-weight="700" stroke="none" fill="#000">Díade — Mobile Architecture &amp; User Flow</text>
    <text x="0" y="52" font-size="14" stroke="none" fill="#666">Milestone 1 Navigation &amp; Space Onboarding Architecture</text>
  </g>

  <!-- Step 1: Authentication Screen Thumbnail -->
  <g transform="translate(64, 140)">
    <rect width="240" height="480" rx="16" />
    <!-- Header -->
    <text x="24" y="40" font-size="14" font-weight="700" stroke="none" fill="#000">01 · Welcome &amp; Auth</text>
    <!-- Screen mock elements -->
    <rect x="24" y="60" width="192" height="120" rx="8" fill="#e6e6e6" />
    <circle cx="120" cy="120" r="28" fill="#fff" />
    <text x="120" y="210" font-size="16" font-weight="700" text-anchor="middle" stroke="none" fill="#000">Díade</text>
    <text x="120" y="230" font-size="11" text-anchor="middle" stroke="none" fill="#666">Two elements. One space.</text>
    <rect x="24" y="380" width="192" height="40" rx="6" fill="#000" />
    <text x="120" y="405" font-size="12" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">Google Sign-In</text>
  </g>

  <!-- Flow Arrow 1 -> Decision -->
  <g transform="translate(304, 380)">
    <line x1="0" y1="0" x2="64" y2="0" stroke-width="2" />
    <polygon points="64,0 52,-6 52,6" fill="#000" />
  </g>

  <!-- Decision Node: Space Member? -->
  <g transform="translate(368, 330)">
    <polygon points="60,0 120,50 60,100 0,50" />
    <text x="60" y="46" font-size="12" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Has Active</text>
    <text x="60" y="62" font-size="12" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Space?</text>
  </g>

  <!-- Branch No -> Step 2: Space Setup -->
  <g transform="translate(488, 380)">
    <!-- Branch Label -->
    <text x="16" y="-12" font-size="12" font-weight="700" stroke="none" fill="#666">NO</text>
    <line x1="0" y1="0" x2="64" y2="0" stroke-width="2" />
    <polygon points="64,0 52,-6 52,6" fill="#000" />
  </g>

  <!-- Step 2: Space Setup Screen Thumbnail -->
  <g transform="translate(552, 140)">
    <rect width="240" height="480" rx="16" />
    <text x="24" y="40" font-size="14" font-weight="700" stroke="none" fill="#000">02 · Space Onboarding</text>
    <!-- Option A -->
    <rect x="24" y="64" width="192" height="150" rx="6" />
    <text x="36" y="90" font-size="12" font-weight="700" stroke="none" fill="#000">Create Space</text>
    <rect x="36" y="106" width="168" height="28" rx="4" />
    <rect x="36" y="146" width="168" height="32" rx="4" fill="#000" />
    <text x="120" y="166" font-size="11" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">Create Space</text>
    <!-- Option B -->
    <rect x="24" y="240" width="192" height="150" rx="6" />
    <text x="36" y="266" font-size="12" font-weight="700" stroke="none" fill="#000">Join Space</text>
    <rect x="36" y="282" width="168" height="28" rx="4" />
    <rect x="36" y="322" width="168" height="32" rx="4" />
    <text x="120" y="342" font-size="11" font-weight="600" text-anchor="middle" stroke="none" fill="#000">Join Space</text>
  </g>

  <!-- Flow Arrow 2 -> Main App -->
  <g transform="translate(792, 380)">
    <line x1="0" y1="0" x2="80" y2="0" stroke-width="2" />
    <polygon points="80,0 68,-6 68,6" fill="#000" />
  </g>

  <!-- Branch Yes: Direct to Main App -->
  <g transform="translate(428, 330)">
    <!-- Branch Label -->
    <text x="12" y="-12" font-size="12" font-weight="700" stroke="none" fill="#666">YES</text>
    <path d="M 0,0 L 0,-140 L 444,-140 L 444,50" fill="none" stroke-width="2" />
    <polygon points="444,50 438,38 450,38" fill="#000" />
  </g>

  <!-- Step 3: Main App Shell & Navigation -->
  <g transform="translate(872, 140)">
    <rect width="280" height="480" rx="16" />
    <text x="24" y="40" font-size="14" font-weight="700" stroke="none" fill="#000">03 · Main App Experience</text>
    <!-- Top Bar -->
    <rect x="24" y="60" width="232" height="36" rx="4" fill="#e6e6e6" />
    <circle cx="236" cy="78" r="10" fill="#000" />
    <!-- Quick Capture Bar -->
    <rect x="24" y="108" width="232" height="32" rx="16" />
    <circle cx="40" cy="124" r="8" fill="#000" />
    <!-- Cards -->
    <rect x="24" y="152" width="232" height="80" rx="6" />
    <text x="36" y="176" font-size="12" font-weight="600" stroke="none" fill="#000">Events · Today</text>
    <rect x="24" y="244" width="232" height="96" rx="6" />
    <text x="36" y="268" font-size="12" font-weight="600" stroke="none" fill="#000">Shared Tasks</text>
    <rect x="24" y="352" width="232" height="60" rx="6" />
    <text x="36" y="376" font-size="12" font-weight="600" stroke="none" fill="#000">Shopping Lists</text>
    <!-- Tab Bar -->
    <g transform="translate(24, 428)">
      <rect width="232" height="36" rx="4" fill="#e6e6e6" />
      <text x="28" y="22" font-size="10" font-weight="700" stroke="none" fill="#000">Today</text>
      <text x="74" y="22" font-size="10" stroke="none" fill="#666">Cal</text>
      <text x="116" y="22" font-size="10" stroke="none" fill="#666">Lists</text>
      <text x="156" y="22" font-size="10" stroke="none" fill="#666">Home</text>
      <text x="198" y="22" font-size="10" stroke="none" fill="#666">Us</text>
    </g>
  </g>

  <!-- Global Quick Capture Modal Callout -->
  <g transform="translate(480, 660)">
    <rect width="672" height="88" rx="8" stroke-dasharray="4,4" />
    <text x="24" y="32" font-size="14" font-weight="700" stroke="none" fill="#000">Global Quick Capture Modal (+)</text>
    <text x="24" y="56" font-size="12" stroke="none" fill="#666">Accessible from any screen in the app. Instant local write to SQLite inbox and synced to partner.</text>
  </g>

  <!-- Connecting line from Capture to Modal -->
  <path d="M 912,248 L 816,248 L 816,660" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="816" cy="660" r="4" fill="#d33" stroke="none" />
</svg>
